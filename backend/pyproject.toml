[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-backend"
version = "0.1.0"
description = "Hackathon Starter Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.32",
    "alembic==1.13.1",
    "python-jose[cryptography]==3.5.0",
    "openai==3.3.1",
    "groq==1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]